# Portal público: SPA estática + JSON publicados pelo motor (/data). O navegador nunca acessa o TSE.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # dados ao vivo: cache curto (absorve pico na CDN). Arquivos em /srv/data (volume do motor, somente leitura)
    location /data/ {
        root /srv;
        add_header Cache-Control "public, max-age=15, stale-while-revalidate=30" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        location ~ \.tmp$ { deny all; }
        location ~ ^/data/(geo|fotos)/ {
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ "^/data/replay/[^/]+/[0-9]{8}T[0-9]{6}\.json$" {
            add_header Cache-Control "public, max-age=86400, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
